<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner</title>
  <link rel="stylesheet" href="/dist/output.css">
</head>
<body class="bg-gray-100 text-gray-800 p-4">

  <!-- Account Verification Section (shown when no account/contact id is
       supplied via the URL) -->
  <div id="accountSection" class="max-w-md mx-auto bg-white shadow p-4 rounded-lg mb-6 hidden">
    <label for="accountInput" class="block text-sm font-medium mb-2">Enter Account Number:</label>
    <input type="text" id="accountInput" placeholder="e.g. 123456" class="w-full p-2 border border-gray-300 rounded mb-3" />
    <button id="verifyAccountBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded w-full">Verify</button>
    <div id="accountStatus" class="mt-3 font-semibold text-sm"></div>
  </div>

  <!-- Scanning View -->
  <div id="scanningView" class="max-w-2xl mx-auto bg-white shadow p-4 rounded-lg hidden flex flex-col items-center">
    <div id="video" style="width: 400px; height: 300px; background:black;"></div>
    <!-- <div id="video" class="w-full max-w-md h-64 mx-auto rounded-lg overflow-hidden"></div> -->

    <div class="flex justify-center mt-4">
      <button id="cancelScanBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">
        Cancel Scan
      </button>
    </div>
  </div>
  
  <!-- Table View (default view now that account verification is disabled) -->
  <div id="tableView" class="max-w-2xl mx-auto bg-white shadow p-4 rounded-lg hidden">

    <div id="output" class="hidden"></div>

    <div id="lastActionOutput" class="hidden text-center font-semibold mb-3 py-2 px-3 rounded"></div>

    <div id="tableSection" class="hidden"></div>
      <!-- <h2 class="text-xl font-semibold mb-2">Item Codes</h2> -->
      <div class="overflow-x-auto mb-4">
        <table id="itemTable" class="table-auto w-full text-sm border border-gray-300 text-center">
          <thead class="bg-gray-100">
            <tr>
              <th class="border px-2 py-1">#</th>
              <th class="border px-2 py-1">PRDS</th>
              <th class="border px-2 py-1">Lot/Serial</th>
              <th class="border px-2 py-1">Expiry Date</th>
              <th class="border px-2 py-1">Count</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

      </div>

      <button id="startBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded mb-3 w-full">Start Scanning</button>

      <!-- Wrapper for buttons -->
      <div id="buttonSection" class="hidden">
        <div class="flex flex-col gap-2 mt-4">
          <button id="scanNextBtn" disabled class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Scan Next</button>
          <button id="removeLastBtn" disabled class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">Remove Last</button>
          <button id="submitBtn" disabled class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Submit List</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirmation View -->
  <div id="confirmationView" class="max-w-md mx-auto bg-white shadow p-6 rounded-lg hidden text-center">
    <p class="text-lg font-semibold mb-4">Are you sure you want to submit?</p>

    <div class="flex justify-center gap-x-2">
      <button id="confirmSubmitBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">
        Yes, Submit
      </button>
      <button id="cancelSubmitBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">
        Cancel
      </button>
    </div>
  </div>

  <!-- Submission Result View -->
  <div id="submissionResultView" class="max-w-2xl mx-auto bg-white shadow p-6 rounded-lg hidden text-center">
    <p id="submissionMessage" class="text-lg font-semibold text-green-600"></p>
  </div>

  <!-- Expired Product Alert Modal -->
  <div id="expiredAlertModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow p-6 w-full max-w-sm text-center">
      <p class="text-lg font-semibold text-red-600 mb-4">⚠ Product Expired</p>
      <p id="expiredAlertMessage" class="text-sm text-gray-700 mb-4"></p>
      <button id="expiredAlertOkBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded w-full">OK</button>
    </div>
  </div>

  <!-- Manual Lot/Serial Entry Modal (opened via the "+" row at the bottom
       of the table, for when a barcode can't be read) -->
  <div id="manualEntryModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow p-6 w-full max-w-sm">
      <p class="text-lg font-semibold mb-4">Add Item Manually</p>
      <label for="manualEntryInput" class="block text-sm font-medium mb-2">Lot/Serial Number:</label>
      <input type="text" id="manualEntryInput" placeholder="e.g. ABC123" class="w-full p-2 border border-gray-300 rounded mb-3" />
      <div id="manualEntryError" class="hidden text-red-600 text-sm mb-3"></div>
      <div class="flex justify-center gap-x-2">
        <button id="manualEntryConfirmBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded flex-1">Add</button>
        <button id="manualEntryCancelBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded flex-1">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Scanbot Library -->
  <script src="/wasm/ScanbotSDK.min.js"></script>
  <script src="app.js?v=20260923-3"></script>
</body>
</html>
